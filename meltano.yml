send_anonymous_usage_stats: true
project_id: tap-trello
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: tap-trello
    namespace: tap_trello
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging
    settings:
    - name: developer_api_key
      kind: password
    - name: access_token
      kind: password
    - name: start_date
      placeholder: '2010-01-01T00:00:00Z'
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
